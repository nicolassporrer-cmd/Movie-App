name: Daily refresh

# Two independent jobs of work, in one daily run:
#   1. Letterboxd sync — anything newly marked watched becomes "seen" (no key needed)
#   2. OMDb scores    — fills in Rotten Tomatoes / Metacritic / posters (needs the key)
# The sync runs even if the OMDb key is absent, so a missing secret cannot block it.
on:
  schedule:
    - cron: '17 6 * * *'      # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max OMDb calls this run'
        required: false
        default: '900'

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync watched films from Letterboxd
        run: node scripts/sync-letterboxd.cjs

      - name: Check for the OMDb key
        id: key
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -z "$OMDB_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OMDB_API_KEY is not set — skipping score enrichment. Add it under Settings > Secrets and variables > Actions."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch a batch of scores from OMDb
        if: steps.key.outputs.present == 'true'
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/enrich-omdb.cjs --unseen-first --limit ${{ github.event.inputs.limit || '900' }}

      - name: Merge scores into the dataset
        if: steps.key.outputs.present == 'true'
        run: node scripts/apply-omdb.cjs

      - name: Check for the TMDB key
        id: tmdb
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TMDB_API_KEY is not set — skipping streaming availability."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Streaming rights rotate, so provider data expires after 7 days. Running daily
      # against that window refreshes roughly a seventh of the library each night
      # instead of all 2,200 at once.
      - name: Refresh streaming availability
        if: steps.tmdb.outputs.present == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/enrich-tmdb.cjs --max-age-days 7

      - name: Merge streaming availability into the dataset
        if: steps.tmdb.outputs.present == 'true'
        run: node scripts/apply-providers.cjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/omdb-cache.json data/tmdb-ids.json data/providers-fr.json public/data/films.json; then
            echo "Nothing changed today."
            exit 0
          fi
          SUMMARY=$(node -e "
            const p=require('./public/data/films.json');
            const noRt=p.films.filter(f=>f.rt==null).length;
            console.log(p.counts.seen+' seen, '+p.counts.watchlist+' to watch, '+noRt+' still without RT');
          ")
          git add data/omdb-cache.json data/tmdb-ids.json data/providers-fr.json public/data/films.json
          git commit -m "Daily refresh: $SUMMARY"
          git push
