name: Refresh Rotten Tomatoes scores

# OMDb's free tier allows 1000 calls/day, and ~1,157 films still need scores.
# This runs daily, fetches a batch, commits, and becomes a no-op once complete.
on:
  schedule:
    - cron: '17 6 * * *'      # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max OMDb calls this run'
        required: false
        default: '900'

permissions:
  contents: write

concurrency:
  group: refresh-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fail early if the key is missing
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -z "$OMDB_API_KEY" ]; then
            echo "::error::OMDB_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Fetch a batch from OMDb
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/enrich-omdb.cjs --unseen-first --limit ${{ github.event.inputs.limit || '900' }}

      - name: Merge scores into the dataset
        run: node scripts/apply-omdb.cjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/omdb-cache.json public/data/films.json; then
            echo "No new scores — nothing to commit."
            exit 0
          fi
          REMAINING=$(node -e "const p=require('./public/data/films.json');console.log(p.films.filter(f=>f.rt==null).length)")
          git add data/omdb-cache.json public/data/films.json
          git commit -m "Refresh OMDb scores ($REMAINING films still without RT)"
          git push
